profile_id: acme_plumbing
menu_order: 0
display_name: AI Lead Finder
sender:
  name: Sender name
  company: Your company
  postal_address: "Your mailing address"
  phone: "Your phone number"
  placeholder_fields:
    - name
    - postal_address
    - phone
brand:
  service_line: ""
  hero_title: "AI Lead Finder"
  hero_subtitle: "Find businesses in the field you choose"
opt_out_line: "If this isn't relevant, just reply \"stop\" and I won't write again."
attributes:
  in_service_area: str
  named_contact: str
  target_industry_match: str
scoring_rules:
  - field: in_service_area
    type: in
    values: ["yes"]
    points: 20
  - field: named_contact
    type: in
    values: ["yes"]
    points: 20
  - field: target_industry_match
    type: in
    values: ["yes"]
    points: 60
approved_claims:
  GENERAL-01: "We would welcome a conversation about whether our services fit your needs."
approved_subjects:
  SUB-01: "An idea for {{organization}}"
  SUB-02: "Quick thought for {{organization}}"
  SUB-03: "Congrats, and an idea for {{organization}}"
cta: "If now isn't a good time, no worries at all. Just reply and I'll follow up whenever suits you."
buyer_persona: "You are a busy local business owner who gets a lot of sales email and deletes anything generic. You reply only when a note is clearly written to you, warm without being pushy, and offers one idea that is actually useful."
note_checks:
  - id: price_question
    phrases: [discount, financing, quote]
    message: "The notes ask about price. A person answers this."
banned_phrases:
  - discount
  - "% off"
  - free
  - guarantee
  - risk-free
  - limited time
  - act now
